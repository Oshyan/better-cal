<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day marks: options</title>
<!-- Mockups of ways to mark one day in a calendar header (docs/design/day-marks.md).
     Invented sample data; open in a browser. The middle day of each row is the marked one. -->
<style>
  body { margin: 0; padding: 20px 24px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #24282f; background: #fff; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 16px; }
  .opt { margin: 0 0 18px; }
  .lab { font-size: 13px; color: #5f6672; margin: 0 0 6px; }
  .lab b { color: #24282f; margin-right: 6px; }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #d4d8de; max-width: 520px; }
  .cell { border-right: 1px solid #d4d8de; min-height: 78px; position: relative; background: #fff; }
  .cell:last-child { border-right: 0; }
  .hd { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; font-size: 12px; color: #5f6672; }
  .wx { font-size: 11px; color: #5f6672; }
  .flag { font-size: 11px; }
  .chip { margin: 3px 5px 0; padding: 1px 6px; font-size: 11px; border-radius: 4px; background: #e1f5ee; color: #085041; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.b { background: #e6f1fb; color: #0c447c; }
  .o1 .hol .hd { background: rgba(63, 168, 96, .2); }
  .o2 .hol .hd { box-shadow: inset 0 3px 0 #3fa860; }
  .o3 .hol .dn { border: 1.5px solid #3fa860; border-radius: 999px; padding: 0 6px; color: #24282f; }
  .o4 .hol .dn, .o4 .hol .flag { color: #2f8a4c; font-weight: 600; }
  .o5 .hol { box-shadow: inset 0 0 0 1.5px rgba(63, 168, 96, .75); }
  .o6 .hol .hd::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 14px 14px 0; border-color: transparent #3fa860 transparent transparent; }
</style>
</head>
<body>
<h1>Marking a day in its header: options weighed for holidays</h1>
<div id="rows"></div>
<script>
  const rows = [
    ['o1', 'Before', 'header background tint (replaced)'],
    ['o2', 'A', 'stripe along the top edge (chosen for holidays)'],
    ['o3', 'B', 'ring around the date'],
    ['o4', 'C', 'date and flag in the mark’s color'],
    ['o5', 'D', 'thin inner outline of the whole day'],
    ['o6', 'E', 'corner tab in the top right'],
  ];
  const cell = (dn, wx, chips, hol) => `<div class="cell${hol ? ' hol' : ''}"><div class="hd"><span class="dn">${dn}</span>${hol ? '<span class="flag">⚑</span>' : ''}<span class="wx">☀ ${wx}</span></div>${chips.map(([t, c]) => `<div class="chip ${c}">${t}</div>`).join('')}</div>`;
  document.getElementById('rows').innerHTML = rows.map(([cls, key, text]) => `<div class="opt ${cls}"><p class="lab"><b>${key}</b>${text}</p><div class="row">${
    cell('Mon 26', '68°', [['Team standup', '']], false)
  }${cell('Tue 27', '72°', [['Water the garden', 'b'], ['Team standup', '']], true)}${
    cell('Wed 28', '64°', [['Design review', '']], false)
  }</div></div>`).join('');
</script>
</body>
</html>
