# Every suite the deploy script gates on, on every push and pull request.
# Nothing here needs a secret or the network: the PHP suite runs against
# SQLite in memory and pure functions, the database suite against a MariaDB
# made for the job, the smoke suite is frontend logic under Node, the static
# check walks the module graph, and the MCP test spawns the server on
# localhost. Only GitHub's own actions and the official PHP and MariaDB images
# are used. One job also installs the PHP libraries the way a fresh install
# does, on the minimum PHP.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# bash, so every step runs with -e -o pipefail: without it, a failing test piped
# into `tail -1` (smoke, static) still ended its step green.
defaults:
  run:
    shell: bash

jobs:
  # Both PHP jobs run in the official PHP 8.4 image, the lowest PHP Better-Cal
  # supports (0.9.0), rather than the runner's stock PHP, which is whatever
  # the Ubuntu image ships (8.3 on 24.04). The image's PHP has no Xdebug.
  server:
    name: PHP suite
    runs-on: ubuntu-latest
    container: php:8.4-cli@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PHP and extensions
        run: php -v && php -m | grep -Ei 'pdo_sqlite|sodium|mbstring|curl'
      # The suite runs with the libraries every install has (the series
      # model reads occurrences through the expander), installed as the
      # other jobs install them.
      - name: Composer
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libzip-dev unzip git
          docker-php-ext-install zip
          php -r 'copy("https://getcomposer.org/installer", "/tmp/composer-setup.php");'
          php -r 'copy("https://composer.github.io/installer.sig", "/tmp/composer-setup.sig");'
          php -r '$expected = trim(file_get_contents("/tmp/composer-setup.sig")); $actual = hash_file("sha384", "/tmp/composer-setup.php"); if (!hash_equals($expected, $actual)) { fwrite(STDERR, "Composer installer signature mismatch\n"); exit(1); }'
          php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
      - name: composer install
        working-directory: server
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Server tests
        run: php server/tests/run.php
      - name: Deploy privilege-boundary tests
        run: bash scripts/tests/deploy-security.sh

  # What depends on the database itself (server/tests/db): foreign keys, row
  # locks, two connections at once, migrations' own SQL, against MariaDB 10.11
  # with the schema the migrations build. The database is this job's alone.
  database:
    name: Database suite
    runs-on: ubuntu-latest
    container: php:8.4-cli@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70
    services:
      mariadb:
        image: mariadb:10.11@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      # git before the checkout, and the whole history: a migration's test
      # makes its rows with an older version's code (oldSource in
      # server/tests/db/lib.php).
      - name: git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The app as installed: its libraries (repeating events need
      # sabre/vobject) from the lock file, as the fresh-install job does.
      - name: The MySQL driver, and Composer
        run: |
          apt-get install -y -qq --no-install-recommends libzip-dev unzip
          docker-php-ext-install zip pdo_mysql
          php -r 'copy("https://getcomposer.org/installer", "/tmp/composer-setup.php");'
          php -r 'copy("https://composer.github.io/installer.sig", "/tmp/composer-setup.sig");'
          php -r '$expected = trim(file_get_contents("/tmp/composer-setup.sig")); $actual = hash_file("sha384", "/tmp/composer-setup.php"); if (!hash_equals($expected, $actual)) { fwrite(STDERR, "Composer installer signature mismatch\n"); exit(1); }'
          php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
      - name: composer install
        working-directory: server
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Database tests
        env:
          BC_TEST_DB: mariadb:3306
        run: php server/tests/db/run.php
      # Each mutation (tools/edit-harness/mutations) patches a copy of the
      # series model, or of the Undo gate, and must trip the check it names
      # while every other check passes.
      - name: Edit harness mutations
        env:
          BC_TEST_DB: mariadb:3306
        run: php tools/edit-harness/mutations/run.php
      # A full run of one seed (the fixed cases included, every required
      # category of the plan-data checks executed), on four processes at once.
      - name: Edit harness, a full seed
        env:
          BC_TEST_DB: mariadb:3306
        run: ./tools/edit-harness/run.sh --seed 7 --cases 1000 --quiet --shards 4
      # The same harness with every series on a Google calendar served by the
      # stand-in Google (no network): a full seed on four processes, the fixed
      # cases and sequences included (the Google split among them), so every
      # category the mode can run is required, as on the full seed above.
      # Only this mode checks what Google holds after each edit (8-google,
      # e-google) and Undo through Google; a shard that ran without --google
      # fails the run.
      - name: Edit harness, Google mode
        env:
          BC_TEST_DB: mariadb:3306
        run: ./tools/edit-harness/run.sh --google --seed 7 --cases 1000 --quiet --shards 4

  # A fresh install on the lowest PHP: Composer installs from the lock file
  # exactly as docs/install.md says, and the suite runs again with the real
  # libraries present. It catches a lock resolved on a newer PHP (0.8.3:
  # Symfony 8 needed 8.4.1 while the floor was 8.3) the day it is pushed,
  # rather than on someone's first install.
  install:
    name: Fresh install on PHP 8.4
    runs-on: ubuntu-latest
    container: php:8.4-cli@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PHP is 8.4
        run: |
          php -v
          php -r 'exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === "8.4" ? 0 : 1);'
      - name: The extensions docs/install.md lists, and Composer
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libzip-dev unzip git python3
          docker-php-ext-install zip pdo_mysql
          php -r 'copy("https://getcomposer.org/installer", "/tmp/composer-setup.php");'
          php -r 'copy("https://composer.github.io/installer.sig", "/tmp/composer-setup.sig");'
          php -r '$expected = trim(file_get_contents("/tmp/composer-setup.sig")); $actual = hash_file("sha384", "/tmp/composer-setup.php"); if (!hash_equals($expected, $actual)) { fwrite(STDERR, "Composer installer signature mismatch\n"); exit(1); }'
          php /tmp/composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
      - name: Platform requirements of the lock file
        working-directory: server
        run: composer check-platform-reqs --lock --no-dev
      - name: composer install, as an install does
        working-directory: server
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Known dependency vulnerabilities
        working-directory: server
        run: composer audit --no-dev --locked
      - name: Server tests with the installed libraries
        env:
          BC_REQUIRE_LIBS: '1'
        run: php server/tests/run.php
      - name: Release trust-boundary tests (offline fixtures, no signing key)
        run: bash scripts/tests/release-security.sh

  web:
    name: Frontend suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Smoke tests, four time zones
        run: |
          for zone in America/Los_Angeles UTC Asia/Tokyo Pacific/Auckland; do
            echo "== $zone =="
            TZ="$zone" node web/tests/smoke.mjs | tail -1
          done
      - name: Static module graph
        run: node --experimental-vm-modules web/tests/static.mjs | tail -1
      - name: MCP server
        run: node tools/mcp/test.mjs
      - name: CI dependency pins
        run: node scripts/check-ci-pins.mjs
      - name: Vendored libraries match their pins and list
        run: node scripts/vendor.mjs --verify
      - name: Dependency-watch reporting
        run: node scripts/tests/dependency-watch.mjs
      - name: Release manifest contract
        run: node scripts/tests/release-manifest.mjs
      - name: Release notes
        run: node scripts/tests/release-notes.mjs
