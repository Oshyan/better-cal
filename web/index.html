<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Better-Cal</title>
  <meta name="description" content="Self-hosted calendar">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181d">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script>try{var t=localStorage.getItem('bc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- Deep-link handoff (/add, /subscribe?url=, ...): the path and query move
       to sessionStorage and the address becomes "/" before the first request
       below is made, so no asset request or Referer ever carries them
       (src/app/handoff.js collects them at boot). -->
  <script>try{if(location.pathname!=='/'){sessionStorage.setItem('bc-handoff',JSON.stringify({path:location.pathname,search:location.search}));history.replaceState(null,'','/')}}catch(e){}</script>
  <!-- Start record: this start is noted before any app code loads, and
       main.js marks it finished once the app has rendered, so a start that
       never got that far (a hung download: a white screen) is still on record
       at the next start (src/app/bootlog.js). A start file that fails to load
       outright gets a message with a reload button instead of a blank page. -->
  <script>try{var bp=localStorage.getItem('bc-boot');if(bp){var bb=JSON.parse(bp);if(bb&&!bb.done)localStorage.setItem('bc-boot-stalled',bp)}localStorage.setItem('bc-boot',JSON.stringify({at:Date.now(),done:false}))}catch(e){}
  addEventListener('error',function(e){var s=e.target;if(!s||s.tagName!=='SCRIPT'||!s.src||window.bcBooted)return;try{var b=JSON.parse(localStorage.getItem('bc-boot')||'{}');b.failed=String(s.src).replace(location.origin,'').split('?')[0];localStorage.setItem('bc-boot',JSON.stringify(b))}catch(x){}var a=document.getElementById('app');if(a&&!a.firstChild){a.innerHTML='<div style="font:16px system-ui,sans-serif;padding:24px;max-width:28em"><p>Better-Cal couldn’t finish loading. The connection may have dropped while it was starting.</p><button type="button" style="font:inherit;padding:8px 16px" onclick="location.reload()">Try again</button></div>'}},true)</script>
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="stylesheet" href="/assets/styles/app.css?v=3">
  <!-- modulepreload:start (filled in by the server: server/src/Http/AppShell.php) -->
  <!-- modulepreload:end -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/assets/src/app/main.js?v=3"></script>
</body>
</html>
