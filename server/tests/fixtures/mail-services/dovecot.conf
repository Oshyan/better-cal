protocols = imap
listen = 127.0.0.1
ssl = required
ssl_cert = </tmp/bc-mail/cert.pem
ssl_key = </tmp/bc-mail/key.pem
mail_location = maildir:/home/sample/Maildir
auth_mechanisms = plain login
passdb {
  driver = passwd-file
  args = /etc/dovecot/sample-passwd
}
userdb {
  driver = static
  args = uid=sample gid=sample home=/home/sample
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
  }
}
