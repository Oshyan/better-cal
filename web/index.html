<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Better-Cal</title>
  <meta name="description" content="Self-hosted calendar">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181d">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script>try{var t=localStorage.getItem('bc-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- Deep-link handoff (/add, /subscribe?url=, ...): the path and query move
       to sessionStorage and the address becomes "/" before the first request
       below is made, so no asset request or Referer ever carries them
       (src/app/handoff.js collects them at boot). -->
  <script>try{if(location.pathname!=='/'){sessionStorage.setItem('bc-handoff',JSON.stringify({path:location.pathname,search:location.search}));history.replaceState(null,'','/')}}catch(e){}</script>
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="stylesheet" href="/assets/styles/app.css?v=3">
  <!-- modulepreload:start (filled in by the server: server/src/Http/AppShell.php) -->
  <!-- modulepreload:end -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/assets/src/app/main.js?v=3"></script>
</body>
</html>
